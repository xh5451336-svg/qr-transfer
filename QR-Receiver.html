<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR 文件接收器 V4</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f3f4f6;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif
}
.wrap{
    max-width:760px;
    margin:auto;
    padding:14px
}
.card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    box-shadow:0 2px 12px #0001
}
h2{
    margin:0 0 8px
}
.tip{
    color:#666;
    font-size:14px;
    line-height:1.6
}
button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:#111;
    color:#fff;
    font-size:17px;
    font-weight:600
}
.videoWrap{
    position:relative;
    margin-top:12px;
    background:#000;
    border-radius:14px;
    overflow:hidden
}
video{
    display:block;
    width:100%;
    height:auto;
    min-height:240px;
    object-fit:cover;
    background:#000
}
#box{
    position:absolute;
    left:50%;
    top:50%;
    width:78%;
    aspect-ratio:1;
    border:3px solid #00ff78;
    border-radius:16px;
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 9999px rgba(0,0,0,.2)
}
.status{
    font-size:19px;
    font-weight:700;
    margin-top:14px
}
.small{
    color:#666;
    font-size:13px;
    margin-top:6px;
    line-height:1.5
}
progress{
    width:100%;
    height:18px;
    margin-top:8px
}
#log{
    white-space:pre-wrap;
    font-size:13px;
    color:#444;
    line-height:1.5
}
.ok{
    color:#14863d
}
.bad{
    color:#c62828
}
a.download{
    display:block;
    margin-top:16px;
    padding:14px;
    border-radius:12px;
    background:#111;
    color:#fff;
    text-decoration:none;
    text-align:center;
    font-weight:600
}
</style>
</head>

<body>
<div class="wrap">
<div class="card">

<h2>QR 文件接收器 V4</h2>

<div class="tip">
请把电脑上的二维码完整放进绿色框。建议手机距离屏幕 30～60cm。
</div>

<button id="start">开启摄像头</button>

<div class="videoWrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="box"></div>
</div>

<div id="status" class="status">等待扫描</div>

<div id="detail" class="small">
等待二维码……
</div>

<progress id="progress" value="0" max="100"></progress>

<pre id="log"></pre>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
'use strict';

const $ = id => document.getElementById(id);

const video = $('video');
const statusEl = $('status');
const detailEl = $('detail');
const progressEl = $('progress');
const logEl = $('log');
const startBtn = $('start');

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', {
    willReadFrequently: true
});

let stream = null;
let timer = null;
let scanning = false;

let lastKey = '';
let lastKeyAt = 0;

const files = new Map();


/* =========================
 * 读取 24 位小端整数
 * ========================= */
function u24(a, p) {
    return (
        a[p] |
        a[p + 1] << 8 |
        a[p + 2] << 16
    ) >>> 0;
}


/* =========================
 * 解析二维码二进制数据
 * ========================= */
function parse(a) {

    if (
        !a ||
        a.length < 20 ||
        a[0] !== 0x51 ||
        a[1] !== 0x52 ||
        a[2] !== 2
    ) {
        return null;
    }

    let p = 3;

    const type = a[p++];
    const idLen = a[p++];

    if (
        idLen !== 8 ||
        p + idLen + 7 > a.length
    ) {
        return null;
    }

    let id = '';

    for (let i = 0; i < idLen; i++) {
        id += String.fromCharCode(a[p++]);
    }

    const seq = u24(a, p);
    p += 3;

    const total = u24(a, p);
    p += 3;

    if (p >= a.length) {
        return null;
    }

    const dl = a[p++];

    if (p + dl > a.length) {
        return null;
    }

    const data = a.slice(p, p + dl);
    p += dl;


    /* 文件元数据 */
    if (type === 1) {

        if (p >= a.length) {
            return null;
        }

        const nl = a[p++];

        if (p + nl + 8 > a.length) {
            return null;
        }

        const name =
            new TextDecoder().decode(
                a.slice(p, p + nl)
            );

        p += nl;

        const size =
            Number(
                new DataView(
                    new Uint8Array(
                        a.slice(p, p + 8)
                    ).buffer
                ).getBigUint64(0, true)
            );

        return {
            type,
            id,
            seq,
            total,
            data,
            name,
            size
        };
    }


    /* SHA-256 校验信息 */
    if (type === 4) {

        if (p + 32 > a.length) {
            return null;
        }

        const hash =
            Array.from(
                a.slice(p, p + 32)
            )
            .map(
                x => x.toString(16).padStart(2, '0')
            )
            .join('');

        return {
            type,
            id,
            seq,
            total,
            data,
            hash
        };
    }


    /* 文件数据分片 */
    if (type === 2) {

        return {
            type,
            id,
            seq,
            total,
            data
        };
    }

    return null;
}


/* =========================
 * 修改状态
 * ========================= */
function setStatus(t, d = '') {

    statusEl.textContent = t;
    detailEl.textContent = d;
}


/* =========================
 * 文件接收完成处理
 * ========================= */
async function finish(f) {

    if (
        !f.meta ||
        !f.hash ||
        f.parts.size !== f.total
    ) {
        return;
    }


    /* 合并所有分片 */
    const all = new Uint8Array(f.size);

    let pos = 0;

    for (let i = 0; i < f.total; i++) {

        const part = f.parts.get(i);

        if (!part) {
            return;
        }

        all.set(part, pos);
        pos += part.length;
    }


    setStatus(
        '正在校验文件…',
        f.name
    );


    /* SHA-256 */
    const digest =
        await crypto.subtle.digest(
            'SHA-256',
            all
        );

    const hs =
        Array.from(
            new Uint8Array(digest)
        )
        .map(
            x => x.toString(16).padStart(2, '0')
        )
        .join('');


    /* 校验失败 */
    if (hs !== f.hash) {

        statusEl.className = 'status bad';

        setStatus(
            '校验失败',
            '数据不完整，请重新扫描'
        );

        return;
    }


    /* 删除旧下载按钮 */
    const old =
        document.querySelector('.download');

    if (old) {
        old.remove();
    }


    /* 创建下载 */
    const a =
        document.createElement('a');

    a.className = 'download';

    a.href =
        URL.createObjectURL(
            new Blob([all])
        );

    a.download =
        f.name || 'received-file';

    a.textContent =
        '点击保存：' +
        (f.name || 'received-file');


    document
        .querySelector('.card')
        .appendChild(a);


    statusEl.className = 'status ok';

    setStatus(
        '接收完成 ✓',
        `${f.name} · ${f.size} bytes`
    );
}


/* =========================
 * 处理二维码
 * ========================= */
async function handle(r) {

    const q =
        parse(
            r.binaryData || []
        );

    if (!q) {
        return;
    }


    /* 防止短时间重复处理同一个二维码 */
    const key =
        q.id +
        ':' +
        q.type +
        ':' +
        q.seq;

    const now = Date.now();

    if (
        key === lastKey &&
        now - lastKeyAt < 500
    ) {
        return;
    }

    lastKey = key;
    lastKeyAt = now;


    /* 获取文件 */
    let f = files.get(q.id);

    if (!f) {

        f = {
            id: q.id,
            total: q.total,
            meta: null,
            hash: null,
            parts: new Map()
        };

        files.set(q.id, f);
    }


    /* 分片总数不一致 */
    if (q.total !== f.total) {
        return;
    }


    /* 文件元数据 */
    if (q.type === 1) {

        f.meta = {
            name: q.name || 'received-file',
            size: q.size
        };

        progressEl.value = 0;

        logEl.textContent =
            `文件：${f.meta.name}\n` +
            `大小：${f.meta.size} bytes\n` +
            `分片：${f.total}`;

        setStatus(
            '已识别文件',
            '正在接收数据'
        );

        return;
    }


    /* SHA-256 */
    if (q.type === 4) {

        f.hash = q.hash;

        setStatus(
            '已收到校验信息',
            f.hash.slice(0, 16) + '…'
        );

        await finish(f);

        return;
    }


    /* 文件数据 */
    if (q.type === 2) {

        if (!f.parts.has(q.seq)) {

            f.parts.set(
                q.seq,
                q.data
            );
        }

        const got =
            f.parts.size;

        const pct =
            f.total
                ? got / f.total * 100
                : 0;

        progressEl.value = pct;

        setStatus(
            `接收中：${got}/${f.total}`,
            `${Math.round(pct)}%`
        );

        await finish(f);
    }
}


/* =========================
 * 二维码解码
 * ========================= */
function decode(image, w, h) {

    let r =
        jsQR(
            image,
            w,
            h,
            {
                inversionAttempts:
                    'dontInvert'
            }
        );

    if (!r) {

        r =
            jsQR(
                image,
                w,
                h,
                {
                    inversionAttempts:
                        'attemptBoth'
                }
            );
    }

    return r;
}


/* =========================
 * Canvas 解码
 * ========================= */
function decodeCanvas(
    source,
    sx,
    sy,
    sw,
    sh,
    dw
) {

    canvas.width = dw;
    canvas.height = dw;

    ctx.drawImage(
        source,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        dw,
        dw
    );


    let im =
        ctx.getImageData(
            0,
            0,
            dw,
            dw
        );


    let r =
        decode(
            im.data,
            dw,
            dw
        );

    if (r) {
        return r;
    }


    /*
     * 轻度二值化：
     * 应对显示器拍摄时的灰雾/反光
     */
    const d = im.data;

    for (
        let i = 0;
        i < d.length;
        i += 4
    ) {

        const y =
            (
                d[i] * 299 +
                d[i + 1] * 587 +
                d[i + 2] * 114
            ) / 1000;

        const v =
            y > 145
                ? 255
                : 0;

        d[i] =
            d[i + 1] =
            d[i + 2] =
            v;

        d[i + 3] = 255;
    }

    return decode(
        d,
        dw,
        dw
    );
}


/* =========================
 * 扫描
 * ========================= */
function scan() {

    if (
        !scanning ||
        video.readyState < 2 ||
        !video.videoWidth
    ) {
        return;
    }


    const w =
        video.videoWidth;

    const h =
        video.videoHeight;


    /*
     * 先扫描整张画面
     */
    let r =
        decodeCanvas(
            video,
            0,
            0,
            w,
            h,
            Math.min(
                1200,
                Math.max(
                    700,
                    Math.min(w, h)
                )
            )
        );


    /*
     * 如果失败，再扫描中心区域
     */
    if (!r) {

        const side =
            Math.floor(
                Math.min(w, h) * .84
            );

        const sx =
            Math.floor(
                (w - side) / 2
            );

        const sy =
            Math.floor(
                (h - side) / 2
            );


        r =
            decodeCanvas(
                video,
                sx,
                sy,
                side,
                side,
                Math.min(
                    1200,
                    Math.max(
                        700,
                        side
                    )
                )
            );
    }


    /* 成功识别 */
    if (r) {

        statusEl.className =
            'status ok';

        detailEl.textContent =
            `已识别二维码 · Version ${r.version}`;


        handle(r)
            .catch(e => {

                statusEl.className =
                    'status bad';

                setStatus(
                    '处理失败',
                    e.message || String(e)
                );

            });
    }
}


/* =========================
 * 开启摄像头
 * ========================= */
startBtn.onclick = async () => {

    if (scanning) {
        return;
    }


    /* 检查 jsQR */
    if (typeof jsQR !== 'function') {

        alert(
            'jsQR 加载失败，请确认手机有网络并刷新页面'
        );

        return;
    }


    try {

        stream =
            await navigator.mediaDevices
                .getUserMedia({
                    video: {
                        facingMode: {
                            ideal: 'environment'
                        },
                        width: {
                            ideal: 1920
                        },
                        height: {
                            ideal: 1080
                        }
                    },
                    audio: false
                });


        video.srcObject =
            stream;

        await video.play();


        scanning = true;

        startBtn.disabled = true;

        startBtn.textContent =
            '扫描中…';


        setStatus(
            '等待扫描',
            '请把二维码完整放入绿色框'
        );


        timer =
            setInterval(
                scan,
                250
            );

    } catch (e) {

        alert(
            '摄像头开启失败：' +
            (e.message || e)
        );
    }
};


/* =========================
 * 页面关闭时释放摄像头
 * ========================= */
window.addEventListener(
    'beforeunload',
    () => {

        if (timer) {
            clearInterval(timer);
        }

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    t => t.stop()
                );
        }
    }
);
</script>

</body>
</html>
