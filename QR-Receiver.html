<!doctype html><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1">
<title>QR 文件接收器 V2</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Arial;margin:0;background:#f3f4f6}.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px #0001}button{padding:12px 18px;border:0;border-radius:10px;background:#111;color:#fff}video{width:100%;border-radius:14px;background:#000;margin-top:12px}.big{font-size:18px;font-weight:700}.small{color:#666;font-size:13px;line-height:1.6}progress{width:100%;height:18px}</style>
<div class=wrap><div class=card><h2>QR 文件接收器 V2</h2><p>手机端。二维码通过屏幕光学传输，不连接内网电脑。</p><button id=b>开启摄像头</button><video id=v autoplay playsinline muted></video><div id=p class=big>等待扫描</div><progress id=pg value=0 max=100></progress><pre id=log></pre></div></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
const $=x=>document.getElementById(x),cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});let stream,timer,files=new Map(),last='';
function u24(a,p){return a[p]|a[p+1]<<8|a[p+2]<<16}
function parse(a){if(a.length<18||a[0]!==0x51||a[1]!==0x52||a[2]!==1)return null;let type=a[3],p=4,il=a[p++];let id='';for(let i=0;i<il;i++)id+=String.fromCharCode(a[p++]);let seq=u24(a,p);p+=3,total=u24(a,p);p+=3;let dl=a[p++],data=a.slice(p,p+dl);p+=dl;if(type===1){let nl=a[p++],nb=a.slice(p,p+nl);p+=nl;let name=new TextDecoder().decode(nb);let dv=new DataView(new Uint8Array(a.slice(p,p+8)).buffer),size=Number(dv.getBigUint64(0,true));p+=8;let hash=[...a.slice(p,p+32)].map(x=>x.toString(16).padStart(2,'0')).join('');return{type,id,seq,total,name,size,hash,data}}return{type,id,seq,total,data}}

async function finish(f){let all=new Uint8Array(f.size),p=0;for(let i=0;i<f.total;i++){let d=f.parts.get(i);if(!d)return;all.set(d,p);p+=d.length}let h=await crypto.subtle.digest('SHA-256',all);let hs=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');if(hs!==f.hash){$('p').textContent='校验失败';return}let blob=new Blob([all]);let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=f.name;a.textContent='点击保存：'+f.name;a.style.display='block';a.style.marginTop='16px';a.style.fontSize='18px';document.querySelector('.card').appendChild(a);$('p').textContent='接收完成 ✓'}
async function handle(res){if(!res)return;let a=res.binaryData||[];let q=parse(a);if(!q)return;let f=files.get(q.id);
 if(q.type===1){f={id:q.id,name:q.name,size:q.size,hash:q.hash,total:q.total,parts:new Map()};files.set(q.id,f);$('log').textContent=`文件：${f.name}\n大小：${f.size} bytes\n分片：${f.total}`;return}
 if(!f)return;if(q.type===2){if(!f.parts.has(q.seq))f.parts.set(q.seq,q.data);$('p').textContent=`接收中：${f.parts.size}/${f.total}`;$('pg').value=f.parts.size/f.total*100;if(f.parts.size===f.total)await finish(f)}
}
$('b').onclick=async()=>{if(typeof jsQR!=='function'){alert('jsQR 加载失败，请检查手机网络后刷新页面');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});$('v').srcObject=stream;timer=setInterval(()=>{let v=$('v');if(v.readyState<2)return;cv.width=v.videoWidth;cv.height=v.videoHeight;ctx.drawImage(v,0,0,cv.width,cv.height);let im=ctx.getImageData(0,0,cv.width,cv.height);let r=jsQR(im.data,im.width,im.height,{inversionAttempts:'dontInvert'});if(r&&r.data!==last){last=r.data;try{handle(r)}catch(e){}}},100)}catch(e){alert('摄像头开启失败：'+e.message)}}
</script>
