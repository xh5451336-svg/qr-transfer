<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>QR 文件接收器 V6.1</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:12px
}

.wrap{
    max-width:760px;
    margin:auto
}

.status{
    background:#202020;
    border-radius:12px;
    padding:14px;
    font-size:17px;
    line-height:1.6;
    margin-bottom:10px
}

.green{
    color:#2ecc71
}

.red{
    color:#ff5c5c
}

.small{
    color:#aaa;
    font-size:13px
}

.info{
    background:#202020;
    border-radius:12px;
    padding:12px;
    line-height:1.7;
    margin-bottom:10px;
    word-break:break-all
}

.scan{
    position:relative;
    background:#000;
    border-radius:12px;
    overflow:hidden
}

.scan video{
    display:block;
    width:100%;
    height:auto
}

.box{
    position:absolute;
    left:12%;
    right:12%;
    top:18%;
    bottom:18%;
    border:3px solid #2ecc71;
    border-radius:16px;
    pointer-events:none
}

.download{
    display:none;
    margin-top:10px;
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#1677ff;
    color:#fff;
    font-size:18px
}
</style>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

</head>

<body>

<div class="wrap">

    <div id="status" class="status">
        正在启动摄像头…
    </div>

    <div class="info">
        文件：<span id="name">-</span><br>
        大小：<span id="size">-</span><br>
        进度：<span id="progress">0/0</span>
        （<span id="pct">0%</span>）<br>
        状态：<span id="state">IDLE</span><br>
        最近帧：<span id="last">-</span>
    </div>

    <div class="scan">
        <video id="video" autoplay muted playsinline></video>
        <div class="box"></div>
    </div>

    <button id="download" class="download">
        保存文件
    </button>

    <div class="small" style="margin-top:8px">
        绿色框内尽量对准电脑二维码；Receiver 会对整帧和中央区域分别尝试解码，并自动忽略重复帧。
    </div>

</div>

<script>

const S = {
    IDLE:'IDLE',
    WAIT_META:'WAIT_META',
    RECEIVING:'RECEIVING',
    VERIFYING:'VERIFYING',
    DONE:'DONE',
    FAIL:'FAIL'
};

let state = S.IDLE;

let fileId = null;
let total = 0;
let meta = null;

let chunks = new Map();

let busy = false;
let stream = null;
let doneUrl = null;

const $ = id => document.getElementById(id);

const video = $('video');

const canvas = document.createElement('canvas');

const ctx = canvas.getContext('2d',{
    willReadFrequently:true
});


function setStatus(t,c=''){

    $('status').className = 'status ' + c;

    $('status').textContent = t;

    $('state').textContent = state;
}


function b64u(s){

    const bin = atob(s);

    const u = new Uint8Array(bin.length);

    for(let i=0;i<bin.length;i++){
        u[i] = bin.charCodeAt(i);
    }

    return u;
}


function hexToU8(h){

    if(!/^[0-9a-fA-F]+$/.test(h) || h.length % 2){
        return null;
    }

    const u = new Uint8Array(h.length / 2);

    for(let i=0;i<u.length;i++){

        u[i] = parseInt(
            h.slice(i*2,i*2+2),
            16
        );

    }

    return u;
}


function eq(a,b){

    if(!a || !b || a.length !== b.length){
        return false;
    }

    for(let i=0;i<a.length;i++){

        if(a[i] !== b[i]){
            return false;
        }

    }

    return true;
}


async function sha(u){

    return new Uint8Array(
        await crypto.subtle.digest(
            'SHA-256',
            u
        )
    );

}


function reset(id){

    fileId = id;

    total = 0;

    meta = null;

    chunks.clear();

    $('name').textContent = '-';

    $('size').textContent = '-';

    $('progress').textContent = '0/0';

    $('pct').textContent = '0%';

    $('last').textContent = '-';

    $('download').style.display = 'none';

    if(doneUrl){

        URL.revokeObjectURL(doneUrl);

        doneUrl = null;

    }

    state = S.WAIT_META;

    setStatus(
        '收到新文件，等待元信息…'
    );
}


function parse(s){

    if(
        typeof s !== 'string' ||
        !s.startsWith('QRF6|')
    ){
        return null;
    }

    const p = s.split('|');

    if(p.length !== 6){
        return null;
    }

    const id = p[1];

    const type = p[2];

    const seq = Number(p[3]);

    const tot = Number(p[4]);

    const payload = p[5];

    if(
        !/^[0-9a-f]{8}$/i.test(id) ||
        !/^[MD]$/.test(type) ||
        !Number.isInteger(seq) ||
        !Number.isInteger(tot) ||
        tot < 0 ||
        tot > 10000000 ||
        seq < 0
    ){
        return null;
    }

    return {
        id,
        type,
        seq,
        tot,
        payload
    };
}


async function handle(s){

    const q = parse(s);

    if(!q){
        return;
    }


    if(fileId === null){

        reset(q.id);

    }


    if(q.id !== fileId){

        reset(q.id);

    }


    if(total !== 0 && q.tot !== total){

        return;

    }


    /*
     * 元信息帧
     *
     * QRF6|fileId|M|0|total|payload
     */

    if(q.type === 'M'){

        if(q.seq !== 0){
            return;
        }

        if(q.tot < 0){
            return;
        }

        let obj;

        try{

            obj = JSON.parse(
                new TextDecoder().decode(
                    b64u(q.payload)
                )
            );

        }catch(e){

            return;

        }


        const size = Number(obj.s);

        const hash = hexToU8(obj.h);

        let name;

        try{

            name = new TextDecoder().decode(
                b64u(obj.n)
            );

        }catch(e){

            return;

        }


        if(
            !Number.isSafeInteger(size) ||
            size < 0 ||
            !hash ||
            hash.length !== 32 ||
            !name
        ){

            return;

        }


        total = q.tot;

        meta = {
            size,
            hash,
            name
        };


        $('name').textContent = name;

        $('size').textContent =
            size.toLocaleString() + ' bytes';


        state =
            total === 0
                ? S.VERIFYING
                : S.RECEIVING;


        setStatus(
            total === 0
                ? '正在校验空文件…'
                : '收到元信息，接收数据…'
        );


        /*
         * 空文件特殊处理
         */

        if(total === 0){

            await finish();

        }

        return;
    }


    /*
     * 数据帧
     *
     * QRF6|fileId|D|seq|total|payload
     */

    if(q.type === 'D'){

        if(
            total === 0 ||
            q.tot !== total ||
            q.seq >= total
        ){

            return;

        }


        /*
         * 如果还没收到元信息，
         * 当前数据帧先不参与重组。
         *
         * Sender 会在每轮开始重复发送 Metadata，
         * 因此后续仍然可以正常接收。
         */

        if(!meta){

            state = S.WAIT_META;

        }


        /*
         * Base64 → Uint8Array
         */

        if(!chunks.has(q.seq)){

            let u;

            try{

                u = b64u(q.payload);

            }catch(e){

                return;

            }

            chunks.set(q.seq,u);

        }


        $('last').textContent =
            `${q.seq+1}/${total}`;


        const got = chunks.size;


        $('progress').textContent =
            `${got}/${total}`;


        $('pct').textContent =
            (got / total * 100).toFixed(1) + '%';


        setStatus(
            meta
                ? `接收中：${got}/${total}`
                : `已收到数据：${got}/${total}，等待元信息…`
        );


        /*
         * 只有：
         *
         * 1. 元信息存在
         * 2. 所有数据帧都收到
         *
         * 才进入最终校验。
         */

        if(meta && got === total){

            await finish();

        }

    }

}


async function finish(){

    if(
        busy ||
        !meta
    ){

        return;

    }

    busy = true;

    state = S.VERIFYING;

    setStatus(
        '数据已收齐，正在校验…'
    );


    try{

        /*
         * 第一遍：
         * 检查所有序号是否完整
         * 同时计算实际字节数
         */

        let totalBytes = 0;


        for(
            let i=0;
            i<total;
            i++
        ){

            if(!chunks.has(i)){

                throw new Error(
                    '缺少第 ' + (i+1) + ' 个数据帧'
                );

            }


            totalBytes +=
                chunks.get(i).length;

        }


        /*
         * 检查文件大小
         */

        if(totalBytes !== meta.size){

            throw new Error(
                `大小不匹配：收到 ${totalBytes}，应为 ${meta.size}`
            );

        }


        /*
         * 按顺序重新组合文件
         */

        const all =
            new Uint8Array(meta.size);


        let off = 0;


        for(
            let i=0;
            i<total;
            i++
        ){

            const c = chunks.get(i);

            all.set(c,off);

            off += c.length;

        }


        /*
         * SHA-256 校验
         */

        const h = await sha(all);


        if(!eq(h,meta.hash)){

            throw new Error(
                'SHA-256 不匹配'
            );

        }


        /*
         * 创建文件
         */

        const blob =
            new Blob(
                [all],
                {
                    type:'application/octet-stream'
                }
            );


        doneUrl =
            URL.createObjectURL(blob);


        $('download').onclick = () => {

            const a =
                document.createElement('a');

            a.href = doneUrl;

            a.download = meta.name;

            document.body.appendChild(a);

            a.click();

            a.remove();

        };


        $('download').style.display =
            'block';


        $('progress').textContent =
            `${total}/${total}`;


        $('pct').textContent =
            '100%';


        state = S.DONE;


        setStatus(
            '✅ 接收完成，SHA-256 校验通过',
            'green'
        );


    }catch(e){

        state = S.FAIL;

        setStatus(
            '❌ ' + e.message,
            'red'
        );

    }finally{

        busy = false;

    }

}


/*
 * QR 解码
 */

function tryScan(data,w,h){

    const r =
        jsQR(
            data,
            w,
            h,
            {
                inversionAttempts:'attemptBoth'
            }
        );

    return r && r.data
        ? r.data
        : null;
}


/*
 * 摄像头扫描
 *
 * 先扫描完整画面
 * 再扫描中央区域
 */

function scan(){

    if(video.readyState < 2){

        requestAnimationFrame(scan);

        return;

    }


    let w = video.videoWidth;

    let h = video.videoHeight;


    if(!w || !h){

        requestAnimationFrame(scan);

        return;

    }


    /*
     * 限制处理宽度，
     * 避免 iPhone 上 CPU 占用过高。
     */

    const maxW = 1280;


    let scale =
        Math.min(
            1,
            maxW / w
        );


    w = Math.floor(w * scale);

    h = Math.floor(h * scale);


    canvas.width = w;

    canvas.height = h;


    ctx.drawImage(
        video,
        0,
        0,
        w,
        h
    );


    /*
     * 方案一：
     * 扫描完整画面
     */

    let img =
        ctx.getImageData(
            0,
            0,
            w,
            h
        );


    let s =
        tryScan(
            img.data,
            w,
            h
        );


    /*
     * 方案二：
     * 扫描中央区域
     *
     * 对准绿色框即可。
     */

    if(!s){

        const cw =
            Math.floor(w * .78);

        const ch =
            Math.floor(h * .78);


        const x =
            Math.floor(
                (w - cw) / 2
            );


        const y =
            Math.floor(
                (h - ch) / 2
            );


        const crop =
            ctx.getImageData(
                x,
                y,
                cw,
                ch
            );


        s =
            tryScan(
                crop.data,
                cw,
                ch
            );

    }


    /*
     * DONE 后不再继续处理二维码
     */

    if(
        s &&
        state !== S.DONE &&
        !busy
    ){

        handle(s).catch(
            e => console.error(e)
        );

    }


    requestAnimationFrame(scan);

}


/*
 * 启动摄像头
 */

async function start(){

    try{

        stream =
            await navigator.mediaDevices.getUserMedia(
                {
                    video:{
                        facingMode:{
                            ideal:'environment'
                        },

                        width:{
                            ideal:1920
                        },

                        height:{
                            ideal:1080
                        }
                    }
                }
            );


        video.srcObject = stream;


        state = S.WAIT_META;


        setStatus(
            '扫描中…'
        );


        scan();


    }catch(e){

        state = S.FAIL;

        setStatus(
            '摄像头启动失败：' +
            e.message,
            'red'
        );

    }

}


window.addEventListener(
    'load',
    start
);

</script>

</body>
</html>
