<!doctype html>

      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

</style>

</head>


<body>

<div class="wrap">

    <div id="status" class="status">
        正在加载 QR 解码器…
    </div>


    <div class="info">

        文件：
        <span id="name">-</span>

        <br>

        大小：
        <span id="size">-</span>

        <br>

        进度：
        <span id="progress">0/0</span>

        （
        <span id="pct">0%</span>
        ）

        <br>

        状态：
        <span id="state">IDLE</span>

        <br>

        已缓存：
        <span id="cached">0</span>
        帧

        <br>

        最近帧：
        <span id="last">-</span>

    </div>


    <div class="scan">

        <video
            id="video"
            autoplay
            muted
            playsinline>
        </video>

        <div class="box"></div>

    </div>


    <button
        id="download"
        class="download">

        保存文件

    </button>


    <div
        class="small"
        style="margin-top:8px">

        请将电脑上的二维码完整放入绿色框附近。
        支持整帧/中央区域扫描、重复帧去重、
        Data 先到 Metadata 后到，
        以及最终 SHA-256 校验。

    </div>

</div>


<script>

'use strict';


/* =========================================================
 * 状态
 * ========================================================= */

const STATE = {

    IDLE: 'IDLE',

    WAIT_META: 'WAIT_META',

    RECEIVING: 'RECEIVING',

    VERIFYING: 'VERIFYING',

    DONE: 'DONE',

    FAIL: 'FAIL'

};


let state = STATE.IDLE;


/* =========================================================
 * 文件状态
 * ========================================================= */

let fileId = null;

/*
 * null = 尚未收到 Metadata
 *
 * 0 = 真正的空文件
 *
 * >0 = 数据帧数量
 */
let total = null;


/*
 * 第一帧 Data 到达时，
 * 即使 Metadata 还没到，
 * 先记录一个 total 提示。
 */
let totalHint = null;


let meta = null;


/*
 * 已确认属于当前文件的数据
 */
let chunks = new Map();


/*
 * Metadata 尚未到达之前，
 * Data 临时放这里。
 */
let pending = new Map();


let busy = false;

let stream = null;

let doneUrl = null;

let scanTimer = null;

let decoderReady = false;


/* =========================================================
 * DOM
 * ========================================================= */

const $ = id =>
    document.getElementById(id);


const video =
    $('video');


const canvas =
    document.createElement('canvas');


const ctx =
    canvas.getContext(
        '2d',
        {
            willReadFrequently:true
        }
    );


/* =========================================================
 * 状态显示
 * ========================================================= */

function setStatus(
    text,
    cls = ''
){

    $('status').className =
        'status ' + cls;

    $('status').textContent =
        text;

    $('state').textContent =
        state;

}


/* =========================================================
 * Base64 → Uint8Array
 * ========================================================= */

function base64ToBytes(str){

    const binary =
        atob(str);

    const bytes =
        new Uint8Array(
            binary.length
        );

    for(
        let i = 0;
        i < binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }

    return bytes;

}


/* =========================================================
 * Uint8Array → UTF-8
 * ========================================================= */

function bytesToUtf8(bytes){

    return new TextDecoder()
        .decode(bytes);

}


/* =========================================================
 * HEX → Uint8Array
 * ========================================================= */

function hexToBytes(hex){

    if(
        typeof hex !== 'string'
    ){

        return null;

    }


    if(
        !/^([0-9a-fA-F]{2})+$/.test(hex)
    ){

        return null;

    }


    const bytes =
        new Uint8Array(
            hex.length / 2
        );


    for(
        let i = 0;
        i < bytes.length;
        i++
    ){

        bytes[i] =
            parseInt(
                hex.slice(
                    i * 2,
                    i * 2 + 2
                ),
                16
            );

    }


    return bytes;

}


/* =========================================================
 * Byte 数组比较
 * ========================================================= */

function sameBytes(a,b){

    if(
        !a ||
        !b ||
        a.length !== b.length
    ){

        return false;

    }


    for(
        let i = 0;
        i < a.length;
        i++
    ){

        if(
            a[i] !== b[i]
        ){

            return false;

        }

    }


    return true;

}


/* =========================================================
 * SHA-256
 * ========================================================= */

async function sha256(bytes){

    const result =
        await crypto.subtle.digest(
            'SHA-256',
            bytes
        );

    return new Uint8Array(result);

}


/* =========================================================
 * 清理文件状态
 * ========================================================= */

function clearFileState(){

    chunks.clear();

    pending.clear();

    meta = null;

    total = null;

    totalHint = null;


    $('name').textContent =
        '-';


    $('size').textContent =
        '-';


    $('progress').textContent =
        '0/0';


    $('pct').textContent =
        '0%';


    $('cached').textContent =
        '0';


    $('last').textContent =
        '-';


    $('download').style.display =
        'none';


    if(doneUrl){

        URL.revokeObjectURL(
            doneUrl
        );

        doneUrl = null;

    }

}


/* =========================================================
 * 解析 QRF6
 *
 * QRF6|fileId|type|seq|total|payload
 *
 * M = Metadata
 * D = Data
 * ========================================================= */

function parseFrame(str){

    if(
        typeof str !== 'string'
    ){

        return null;

    }


    if(
        !str.startsWith('QRF6|')
    ){

        return null;

    }


    const parts =
        str.split('|');


    if(
        parts.length !== 6
    ){

        return null;

    }


    const fileIdValue =
        parts[1];


    const type =
        parts[2];


    const seq =
        Number(parts[3]);


    const tot =
        Number(parts[4]);


    const payload =
        parts[5];


    if(
        !/^[0-9a-f]{8}$/i.test(
            fileIdValue
        )
    ){

        return null;

    }


    if(
        type !== 'M' &&
        type !== 'D'
    ){

        return null;

    }


    if(
        !Number.isSafeInteger(seq) ||
        !Number.isSafeInteger(tot)
    ){

        return null;

    }


    if(
        seq < 0 ||
        tot < 0 ||
        tot > 10000000
    ){

        return null;

    }


    /*
     * Metadata 必须是 seq 0
     */

    if(
        type === 'M' &&
        seq !== 0
    ){

        return null;

    }


    /*
     * Data seq 必须在 0 ~ total-1
     */

    if(
        type === 'D' &&
        seq >= tot
    ){

        return null;

    }


    if(
        !payload ||
        payload.length > 20000
    ){

        return null;

    }


    return {

        id:fileIdValue,

        type:type,

        seq:seq,

        tot:tot,

        payload:payload

    };

}


/* =========================================================
 * 更新进度
 * ========================================================= */

function updateProgress(){

    let known = 0;


    if(meta){

        known =
            chunks.size;

    }else{

        known =
            pending.size;

    }


    if(total === null){

        $('progress').textContent =
            `${known}/?`;

        $('pct').textContent =
            '0%';

    }else{

        $('progress').textContent =
            `${known}/${total}`;


        if(total > 0){

            $('pct').textContent =
                Math.min(
                    100,
                    known / total * 100
                ).toFixed(1) + '%';

        }else{

            $('pct').textContent =
                '0%';

        }

    }


    $('cached').textContent =
        String(pending.size);

}


/* =========================================================
 * 保存 Data
 * ========================================================= */

function storeData(q){

    let bytes;


    try{

        bytes =
            base64ToBytes(
                q.payload
            );

    }catch(e){

        return false;

    }


    /*
     * 非空文件不能出现空数据帧
     */

    if(
        bytes.length === 0 &&
        q.tot > 0
    ){

        return false;

    }


    /*
     * Metadata 已经收到
     */

    if(meta){

        if(
            !chunks.has(q.seq)
        ){

            chunks.set(
                q.seq,
                bytes
            );

        }

    }


    /*
     * Metadata 还没收到
     *
     * 先缓存
     */

    else{

        if(
            !pending.has(q.seq)
        ){

            pending.set(
                q.seq,
                bytes
            );

        }

    }


    $('last').textContent =
        `${q.seq + 1}/${q.tot}`;


    updateProgress();


    return true;

}


/* =========================================================
 * 把 Metadata 到达之前缓存的数据
 * 转移到正式 chunks
 * ========================================================= */

function adoptPending(){

    if(
        total === null
    ){

        return;

    }


    for(
        const [seq, bytes]
        of pending
    ){

        if(
            seq >= 0 &&
            seq < total &&
            !chunks.has(seq)
        ){

            chunks.set(
                seq,
                bytes
            );

        }

    }


    pending.clear();


    updateProgress();

}


/* =========================================================
 * 处理 Metadata
 *
 * Metadata JSON:
 *
 * {
 *   s: fileSize,
 *   h: sha256Hex,
 *   n: fileNameBase64
 * }
 *
 * ========================================================= */

async function handleMetadata(q){

    let obj;


    try{

        obj =
            JSON.parse(
                bytesToUtf8(
                    base64ToBytes(
                        q.payload
                    )
                )
            );

    }catch(e){

        return;

    }


    const size =
        Number(
            obj &&
            obj.s
        );


    const hash =
        hexToBytes(
            obj &&
            obj.h
        );


    let name;


    try{

        name =
            bytesToUtf8(
                base64ToBytes(
                    obj &&
                    obj.n
                )
            );

    }catch(e){

        return;

    }


    /*
     * 验证 Metadata
     */

    if(
        !Number.isSafeInteger(size) ||
        size < 0 ||
        !hash ||
        hash.length !== 32 ||
        typeof name !== 'string' ||
        !name
    ){

        return;

    }


    /*
     * 如果之前已经从 Data 获得了 total，
     * 必须和 Metadata 一致。
     */

    if(
        totalHint !== null &&
        q.tot !== totalHint
    ){

        state =
            STATE.FAIL;


        setStatus(
            `❌ 帧总数不一致：Data=${totalHint}，Metadata=${q.tot}`,
            'red'
        );


        return;

    }


    /*
     * 如果 total 已经存在，
     * 再次校验
     */

    if(
        total !== null &&
        q.tot !== total
    ){

        state =
            STATE.FAIL;


        setStatus(
            `❌ 帧总数不一致：已有 ${total}，Metadata=${q.tot}`,
            'red'
        );


        return;

    }


    total =
        q.tot;


    meta = {

        size:size,

        hash:hash,

        name:name

    };


    $('name').textContent =
        name;


    $('size').textContent =
        size.toLocaleString() +
        ' bytes';


    /*
     * 关键：
     *
     * Metadata 到达后，
     * 把之前缓存的 Data 接管过来。
     */

    adoptPending();


    /*
     * 空文件
     */

    if(
        total === 0
    ){

        state =
            STATE.VERIFYING;


        updateProgress();


        setStatus(
            '正在校验空文件…'
        );


        await finish();


        return;

    }


    state =
        STATE.RECEIVING;


    updateProgress();


    setStatus(
        `接收中：${chunks.size}/${total}`
    );


    /*
     * 如果 Metadata 到达之前，
     * Data 已经全部缓存，
     * 直接完成。
     */

    if(
        chunks.size === total
    ){

        await finish();

    }

}


/* =========================================================
 * 处理一帧二维码
 * ========================================================= */

async function handleFrame(str){

    if(
        state === STATE.DONE ||
        state === STATE.FAIL ||
        busy
    ){

        return;

    }


    const q =
        parseFrame(str);


    if(!q){

        return;

    }


    /*
     * 第一个二维码确定 fileId
     */

    if(
        fileId === null
    ){

        fileId =
            q.id;

        clearFileState();

    }


    /*
     * 新文件
     */

    else if(
        q.id !== fileId
    ){

        fileId =
            q.id;

        clearFileState();

    }


    /*
     * Data 可能在 Metadata 之前到达
     *
     * 所以这里先记录 totalHint
     */

    if(
        totalHint === null
    ){

        totalHint =
            q.tot;

    }


    /*
     * 同一个文件，
     * total 必须始终一致。
     */

    if(
        totalHint !== q.tot
    ){

        return;

    }


    /*
     * Metadata
     */

    if(
        q.type === 'M'
    ){

        await handleMetadata(q);

        return;

    }


    /*
     * Data
     */

    if(
        q.type === 'D'
    ){

        /*
         * Metadata 已经收到以后，
         * seq 必须小于正式 total。
         */

        if(
            total !== null &&
            q.seq >= total
        ){

            return;

        }


        /*
         * 关键修复：
         *
         * 即使 Metadata 还没有到，
         * Data 也先缓存。
         */

        const ok =
            storeData(q);


        if(!ok){

            return;

        }


        /*
         * Metadata 已经存在
         */

        if(meta){

            state =
                STATE.RECEIVING;


            setStatus(
                `接收中：${chunks.size}/${total}`
            );


            if(
                chunks.size === total
            ){

                await finish();

            }

        }


        /*
         * Metadata 尚未存在
         */

        else{

            state =
                STATE.WAIT_META;


            setStatus(
                `已缓存数据：${pending.size}/${q.tot}，等待元信息…`,
                'yellow'
            );

        }

    }

}


/* =========================================================
 * 最终文件校验
 * ========================================================= */

async function finish(){

    if(
        busy ||
        !meta ||
        total === null
    ){

        return;

    }


    busy = true;


    state =
        STATE.VERIFYING;


    setStatus(
        '数据已收齐，正在校验…'
    );


    try{

        /*
         * 必须数量完全一致
         */

        if(
            chunks.size !== total
        ){

            throw new Error(
                `缺少数据帧：${chunks.size}/${total}`
            );

        }


        /*
         * 检查每一个 seq
         */

        let totalBytes = 0;


        for(
            let i = 0;
            i < total;
            i++
        ){

            if(
                !chunks.has(i)
            ){

                throw new Error(
                    `缺少第 ${i + 1} 个数据帧`
                );

            }


            totalBytes +=
                chunks.get(i).length;

        }


        /*
         * 文件大小校验
         */

        if(
            totalBytes !== meta.size
        ){

            throw new Error(
                `文件大小不匹配：收到 ${totalBytes}，应为 ${meta.size}`
            );

        }


        /*
         * 按 seq 顺序重新组合
         */

        const all =
            new Uint8Array(
                meta.size
            );


        let offset = 0;


        for(
            let i = 0;
            i < total;
            i++
        ){

            const chunk =
                chunks.get(i);


            all.set(
                chunk,
                offset
            );


            offset +=
                chunk.length;

        }


        /*
         * SHA-256
         */

        const hash =
            await sha256(all);


        if(
            !sameBytes(
                hash,
                meta.hash
            )
        ){

            throw new Error(
                'SHA-256 校验失败'
            );

        }


        /*
         * 创建 Blob
         */

        const blob =
            new Blob(
                [all],
                {
                    type:
                        'application/octet-stream'
                }
            );


        doneUrl =
            URL.createObjectURL(
                blob
            );


        /*
         * 保存按钮
         */

        $('download').onclick =
            () => {

                const a =
                    document.createElement(
                        'a'
                    );


                a.href =
                    doneUrl;


                a.download =
                    meta.name ||
                    'received-file';


                document.body.appendChild(a);


                a.click();


                a.remove();

            };


        $('download').style.display =
            'block';


        $('progress').textContent =
            `${total}/${total}`;


        $('pct').textContent =
            '100%';


        state =
            STATE.DONE;


        setStatus(
            '✅ 接收完成，SHA-256 校验通过',
            'green'
        );


    }catch(e){

        state =
            STATE.FAIL;


        setStatus(
            '❌ ' + e.message,
            'red'
        );

    }finally{

        busy = false;

    }

}


/* =========================================================
 * QR 解码
 * ========================================================= */

function decodeQR(
    data,
    width,
    height
){

    if(
        !decoderReady ||
        typeof jsQR !== 'function'
    ){

        return null;

    }


    try{

        const result =
            jsQR(
                data,
                width,
                height,
                {
                    inversionAttempts:
                        'attemptBoth'
                }
            );


        if(
            result &&
            result.data
        ){

            return result.data;

        }

    }catch(e){

        console.error(
            'QR decode error:',
            e
        );

    }


    return null;

}


/* =========================================================
 * 扫描
 *
 * 1. 整张画面
 *
 * 2. 中央 82%
 *
 * ========================================================= */

function scanOnce(){

    if(
        !decoderReady ||
        state === STATE.DONE ||
        state === STATE.FAIL
    ){

        return;

    }


    if(
        video.readyState < 2 ||
        !video.videoWidth
    ){

        return;

    }


    let width =
        video.videoWidth;


    let height =
        video.videoHeight;


    /*
     * 最大处理宽度 1280
     */

    const maxWidth =
        1280;


    const scale =
        Math.min(
            1,
            maxWidth / width
        );


    width =
        Math.max(
            1,
            Math.floor(
                width * scale
            )
        );


    height =
        Math.max(
            1,
            Math.floor(
                height * scale
            )
        );


    canvas.width =
        width;


    canvas.height =
        height;


    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    /*
     * 第一遍：
     * 整张图片
     */

    let image =
        ctx.getImageData(
            0,
            0,
            width,
            height
        );


    let result =
        decodeQR(
            image.data,
            width,
            height
        );


    /*
     * 第二遍：
     * 中央区域
     */

    if(!result){

        const cropWidth =
            Math.floor(
                width * 0.82
            );


        const cropHeight =
            Math.floor(
                height * 0.82
            );


        const x =
            Math.floor(
                (width - cropWidth) / 2
            );


        const y =
            Math.floor(
                (height - cropHeight) / 2
            );


        image =
            ctx.getImageData(
                x,
                y,
                cropWidth,
                cropHeight
            );


        result =
            decodeQR(
                image.data,
                cropWidth,
                cropHeight
            );

    }


    if(result){

        handleFrame(result)
            .catch(
                e =>
                    console.error(
                        'handleFrame error:',
                        e
                    )
            );

    }

}


/* =========================================================
 * 启动扫描循环
 * ========================================================= */

function startScanLoop(){

    if(scanTimer){

        return;

    }


    /*
     * 160ms 扫一次
     * ≈ 6.25 次/秒
     */

    scanTimer =
        setInterval(
            scanOnce,
            160
        );

}


/* =========================================================
 * 加载 jsQR
 *
 * 第一地址失败：
 * jsDelivr
 *
 * 第二地址：
 * unpkg
 * ========================================================= */

function loadDecoder(){

    return new Promise(
        (resolve,reject) => {

            if(
                typeof jsQR === 'function'
            ){

                decoderReady = true;

                resolve();

                return;

            }


            const urls = [

                'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js',

                'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'

            ];


            let index = 0;


            function next(){

                if(
                    typeof jsQR === 'function'
                ){

                    decoderReady = true;

                    resolve();

                    return;

                }


                if(
                    index >= urls.length
                ){

                    reject(
                        new Error(
                            'QR 解码器加载失败，请检查手机网络'
                        )
                    );

                    return;

                }


                const script =
                    document.createElement(
                        'script'
                    );


                script.src =
                    urls[index++];


                script.onload =
                    () => {

                        if(
                            typeof jsQR === 'function'
                        ){

                            decoderReady = true;

                            resolve();

                        }else{

                            next();

                        }

                    };


                script.onerror =
                    () => {

                        next();

                    };


                document.head.appendChild(
                    script
                );

            }


            next();

        }
    );

}


/* =========================================================
 * 启动摄像头
 * ========================================================= */

async function startCamera(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        throw new Error(
            '当前浏览器不支持摄像头'
        );

    }


    stream =
        await navigator.mediaDevices.getUserMedia({

            video:{

                facingMode:{
                    ideal:'environment'
                },

                width:{
                    ideal:1920
                },

                height:{
                    ideal:1080
                }

            },

            audio:false

        });


    video.srcObject =
        stream;


    await video.play();

}


/* =========================================================
 * 启动
 * ========================================================= */

async function boot(){

    try{

        /*
         * 先加载二维码解码器
         */

        await loadDecoder();


        setStatus(
            'QR 解码器已加载，正在启动摄像头…'
        );


        /*
         * 再启动摄像头
         */

        await startCamera();


        state =
            STATE.WAIT_META;


        setStatus(
            '扫描中…',
            'green'
        );


        startScanLoop();


    }catch(e){

        state =
            STATE.FAIL;


        setStatus(
            '❌ ' + e.message,
            'red'
        );

    }

}


/* =========================================================
 * 页面退出
 * ========================================================= */

window.addEventListener(
    'pagehide',
    () => {

        if(scanTimer){

            clearInterval(
                scanTimer
            );

            scanTimer = null;

        }


        if(stream){

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        if(doneUrl){

            URL.revokeObjectURL(
                doneUrl
            );

        }

    }
);


/* =========================================================
 * 页面加载
 * ========================================================= */

window.addEventListener(
    'load',
    boot
);

</script>
